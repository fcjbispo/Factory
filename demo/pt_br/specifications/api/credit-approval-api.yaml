openapi: 3.0.3
info:
  title: Credit Approval API
  description: |
    API REST para submissão e avaliação de aplicações de crédito.
    Todos os endpoints requerem autenticação JWT exceto health checks.
  version: 1.0.0
  contact:
    name: Credit Approval Team

servers:
  - url: https://api.example.com/v1
    description: Produção
  - url: https://staging-api.example.com/v1
    description: Staging

security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Health check
      security: []
      responses:
        '200':
          description: Serviço está saudável
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  version:
                    type: string
                    example: 1.0.0

  /applications:
    post:
      summary: Submeter uma nova aplicação de crédito
      description: |
        Cria uma nova CreditApplication e dispara avaliação assíncrona.
        Rate limit de 10 requisições/minuto por aplicante.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditApplicationInput'
      responses:
        '201':
          description: Aplicação criada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditApplication'
        '400':
          description: Erro de validação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          description: Rate limit excedido

  /applications/{id}:
    get:
      summary: Recuperar uma aplicação de crédito
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Aplicação encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditApplication'
        '404':
          description: Aplicação não encontrada

  /applications/{id}/decision:
    get:
      summary: Recuperar a decisão de crédito de uma aplicação
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Decisão encontrada (pode estar pendente se ainda não decidida)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditDecision'
        '404':
          description: Aplicação não encontrada

  /applications/{id}/override:
    post:
      summary: Anular manualmente uma decisão de crédito
      description: |
        Requer papel `CREDIT_ADMIN`. Cria uma nova decisão e publica evento.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OverrideInput'
      responses:
        '200':
          description: Decisão anulada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditDecision'
        '403':
          description: Permissões insuficientes
        '404':
          description: Aplicação não encontrada
        '409':
          description: Aplicação não está em estado DECIDED

  /applications/{id}/audit:
    get:
      summary: Recuperar a trilha de auditoria de uma aplicação
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Entradas da trilha de auditoria
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditTrailEntry'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CreditApplicationInput:
      type: object
      required:
        - applicant_id
        - declared_income
        - requested_amount
      properties:
        applicant_id:
          type: string
          format: uuid
          description: Referência ao Applicant
        declared_income:
          type: number
          format: decimal
          minimum: 0.01
          description: Renda mensal na moeda especificada
        requested_amount:
          type: number
          format: decimal
          minimum: 100
          description: Limite de crédito solicitado
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          default: USD
          description: Código de moeda ISO 4217

    CreditApplication:
      type: object
      properties:
        id:
          type: string
          format: uuid
        applicant_id:
          type: string
          format: uuid
        declared_income:
          type: number
          format: decimal
        requested_amount:
          type: number
          format: decimal
        currency:
          type: string
        credit_score:
          type: integer
          nullable: true
          minimum: 300
          maximum: 850
        risk_band:
          type: string
          enum: [LOW, MEDIUM, HIGH, INELIGIBLE]
          nullable: true
        status:
          type: string
          enum: [SUBMITTED, SCORING, DECIDED, REJECTED]
        submitted_at:
          type: string
          format: date-time
        decided_at:
          type: string
          format: date-time
          nullable: true

    CreditDecision:
      type: object
      properties:
        id:
          type: string
          format: uuid
        application_id:
          type: string
          format: uuid
        decision:
          type: string
          enum: [APPROVED, REJECTED, PARTIALLY_APPROVED]
        approved_amount:
          type: number
          format: decimal
          nullable: true
        reason:
          type: string
          maxLength: 500
        decided_at:
          type: string
          format: date-time
        decided_by:
          type: string
          description: SYSTEM ou ID do usuário admin

    OverrideInput:
      type: object
      required:
        - decision
        - approved_amount
        - reason
      properties:
        decision:
          type: string
          enum: [APPROVED, REJECTED, PARTIALLY_APPROVED]
        approved_amount:
          type: number
          format: decimal
          minimum: 0
        reason:
          type: string
          minLength: 20
          maxLength: 500

    AuditTrailEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        application_id:
          type: string
          format: uuid
        action:
          type: string
          enum: [SUBMITTED, SCORE_RECEIVED, DECIDED, OVERRIDDEN]
        actor:
          type: string
        payload:
          type: object
          description: JSON payload específico para a ação
        occurred_at:
          type: string
          format: date-time

    ValidationError:
      type: object
      properties:
        error:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
